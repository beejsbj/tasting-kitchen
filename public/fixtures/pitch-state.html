<!doctype html><meta charset="utf-8"><title>Pitch-state fixture</title><style>body{font:16px system-ui;background:#111;color:#eee;padding:2rem}button{padding:.6rem;margin:.2rem}.key{display:inline-block;border:1px solid #777;padding:1.2rem .7rem;margin:.15rem}.tonic{background:#ffbf4d;color:#111}.degree{outline:3px solid #5ee1b8}.pressed{box-shadow:inset 0 -8px #ff5f7e}</style><h1>Movable pitch state</h1><p>Choose a tonic, then press a key. Degree 1 follows the tonic; pressed state is separate.</p><button onclick="setTonic('C')">C tonic</button><button onclick="setTonic('D')">D tonic</button><div id="keys"></div><script>let tonic='C',pressed='';const notes=['C','D','E','F','G','A','B'];function setTonic(n){tonic=n;draw()}function draw(){keys.innerHTML=notes.map(n=>`<button class="key ${n===tonic?'tonic degree':''} ${n===pressed?'pressed':''}" onclick="pressed='${n}';draw()">${n}</button>`).join('')}draw()</script>
