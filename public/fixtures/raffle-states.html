<!doctype html><meta charset="utf-8"><title>Raffle-state fixture</title><style>body{font:18px Georgia;background:#241424;color:#fff4df;padding:2rem}.card{max-width:30rem;padding:2rem;border:3px solid #f5a742}.quiet{opacity:.7}.reduced *{transition:none!important;animation:none!important}</style><button onclick="document.body.classList.toggle('reduced')">Toggle reduced motion</button><p><button onclick="show('waiting')">Waiting</button><button onclick="show('failure')">Failure</button><button onclick="show('reveal')">Reveal</button><button onclick="show('win')">Win</button></p><main class="card" id="card"></main><script>const s={waiting:['Waiting','The room is holding its breath.'],failure:['Connection lost','The draw has not been confirmed.'],reveal:['Ticket 18','The selected ticket is visible.'],win:['Garden lights','The neighborhood project wins.']};function show(k){card.innerHTML=`<h1>${s[k][0]}</h1><p>${s[k][1]}</p>`}show('waiting')</script>
