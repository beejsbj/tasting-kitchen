<!doctype html><meta charset="utf-8"><title>Cascade diagnosis fixture</title><style>body{font:16px system-ui;padding:2rem}.block{margin:.4rem;padding:.7rem;background:#dbeafe}button{padding:.5rem}</style><h1>Persisted cascade diagnosis</h1><p>Move A to 10:00. The visible cascade shifts B and C. Reload reveals the persisted-state fault.</p><button onclick="move()">Move A to 10:00</button><button onclick="reloadState()">Reload stored state</button><div id="state"></div><script>let moved=false;function draw(a,b,c){state.innerHTML=`<p class="block">A ${a}</p><p class="block">B ${b}</p><p class="block">C ${c}</p>`}function move(){moved=true;draw('10:00','11:00','12:00')}function reloadState(){draw('10:00','10:00','11:00')}draw('09:00','10:00','11:00')</script>
