<!doctype html><meta charset="utf-8"><title>Scheduler collision fixture</title><style>body{font:15px system-ui;padding:1rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(12rem,1fr));gap:1rem}.card{border:1px solid #777;padding:1rem}.block{margin:.4rem 0;padding:.5rem;background:#d9eaff}.collision{background:#ffcf96}</style><h1>One collision, four hypotheses</h1><p>Move Walk from 09:00 to 10:00 in each card. Each card must explain a different consequence.</p><div class="grid"><section class="card"><h2>Push</h2><p class="block collision">Walk 10:00</p><p class="block">Call 11:00</p><p class="block">Study 12:00</p></section><section class="card"><h2>Ask</h2><p class="block collision">Walk overlaps Call</p><button>Choose a resolution</button></section><section class="card"><h2>Stack</h2><p class="block collision">Walk + Call at 10:00</p><p class="block">Study 11:00</p></section><section class="card"><h2>Reserve</h2><p class="block collision">10:00 unavailable</p><p class="block">Preview next slot</p></section></div>
