server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare Tunnel terminates the public connection before Traefik, so
    # redirect the original cleartext request at the application boundary.
    if ($http_cf_visitor ~* '"scheme":"http"') {
        return 308 https://tasting-kitchen.burooj.dev$request_uri;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
    }

    # Opaque sandbox origins need anonymous CORS for local JS modules and data.
    # Artifact HTML keeps a sandbox even when opened in a separate tab.
    location /dishes/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms; default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /data/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
